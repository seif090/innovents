version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: innovent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-innovent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-innovent_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-innovent_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U innovent_user -d innovent_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innovent-net

  redis:
    image: redis:7-alpine
    container_name: innovent-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innovent-net

  minio:
    image: minio/minio:latest
    container_name: innovent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - innovent-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: innovent-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://innovent_user:innovent_secure_pass_2026@postgres:5432/innovent_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-innovent_dev_access_jwt_secret_change_in_production_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-innovent_dev_refresh_jwt_secret_change_in_production_min_32_chars}
    ports:
      - '3000:3000'
    networks:
      - innovent-net

networks:
  innovent-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
